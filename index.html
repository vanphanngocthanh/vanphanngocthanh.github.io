<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="Phan Ngọc Thanh Vân - Corporate Communications"><meta property="og:description" content="PMP® certified Communications &amp; Project Management professional with 10+ years in corporate communications, branding and large-scale events, plus Power BI dashboards.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: light theme. Colored hero with one big rounded corner (role, name, 2-sentence intro left; background-free photo right, bottom-aligned; centered when there is no photo). Report list as cards with a first-page screenshot; each opens a viewer with the live report and key insights. Swap the palette tokens for the user's palette. */
/* Palette tokens: --hero (hero and skills band), --cta (buttons, bullets, badges), --cta-soft (contact box), --accent (labels, links, chips). */
:root {
  --bg:#ffffff; --surface:#f3f3fb; --hero:#dfe1f7; --chart:#7b7fd9; --cta:#12806c;
  --ink:#2e3142; --muted:#666a78; --line:#e4e4ee; --on-hero:#2b35af; --on-hero-text:#2d3170; --cta-ink:#ffffff;
  --claude:#c15f3c; --claude-soft:#fbeee8; --accent:#2b35af; --accent-ink:#ffffff; --accent-soft:#e8e9f8; --cta-soft:#e3f3ef;
  --shadow:0 18px 40px -26px rgba(43,53,175,.40); --scrim:rgba(30,33,60,.55);
  color-scheme:light;
  --f-display:"Open Sans","Helvetica Neue",Arial,sans-serif;
  --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
body.locked{overflow:hidden}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,.card:focus-visible{outline:2px solid var(--cta);outline-offset:3px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}
.label{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font-weight:700;font-size:1.02rem;text-decoration:none;color:var(--ink)}
.nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav ul a{color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:600}
.nav ul a:hover,.nav ul a.main{color:var(--ink)}
@media (max-width:600px){.nav ul{gap:14px}.nav .hide-sm{display:none}}

/* Hero */
.hero-outer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;max-width:1240px;margin:0 auto;background:var(--hero);border-radius:28px 28px 28px 110px;overflow:hidden}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:end;padding-block:36px 0}
.hero.solo .wrap{grid-template-columns:1fr;padding-block:56px}
.hero-text{min-width:0;padding-bottom:44px}
.hero.solo .hero-text{padding-bottom:0;text-align:center;max-width:46em;margin:0 auto}
.hero.solo .intro{margin-left:auto;margin-right:auto}
.hero.solo .cta{justify-content:center}
.hero .label{color:var(--on-hero);opacity:.95}
.hero h1{font-weight:700;font-size:clamp(2.3rem,5vw,3.6rem);line-height:1.05;margin:0 0 16px;color:var(--on-hero)}
.hero .intro{margin:0 0 24px;color:var(--on-hero-text);font-size:1.06rem;max-width:40em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:999px;font:600 .9rem var(--f-body);text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.white{background:var(--bg);color:var(--ink)}
.btn.outline{background:transparent;color:var(--on-hero);border-color:color-mix(in srgb,var(--on-hero) 70%,transparent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.portrait{justify-self:end;align-self:end;width:100%;max-width:300px}
.portrait img{width:100%;height:auto;display:block}
@media (max-width:820px){
  .hero{border-radius:24px 24px 24px 64px}
  .hero .wrap{grid-template-columns:1fr;gap:0;padding-block:28px 0}
  .portrait{justify-self:center;max-width:300px}
  .hero-text{padding-bottom:28px}
}

section.block>.wrap{padding-block:64px}
section.minor>.wrap{padding-block:48px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h2{font-weight:700;font-size:clamp(1.5rem,3vw,2.05rem);margin:0;color:var(--ink)}
section.minor h2{font-size:clamp(1.25rem,2.4vw,1.6rem)}
.sec-head p{margin:0;color:var(--muted);font-size:.95rem;max-width:36em}

/* Comms case studies */
#comms>.wrap{padding-block:64px 8px}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px;align-items:start}
.case{border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.case-img{aspect-ratio:16/9;max-width:100%;background:var(--surface)}
@media (min-width:860px){.case:only-child{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center}.case:only-child>.case-body{order:1;padding:32px 36px}.case:only-child>.case-gallery,.case:only-child>.case-img{order:2;height:100%}.case:only-child>.case-gallery{grid-template-columns:1fr;align-content:stretch;background:var(--bg)}}
figure.case-img{margin:0;position:relative}
.img-cap{position:absolute;right:12px;bottom:12px;font-size:.8rem;font-weight:400;background:var(--bg);color:var(--ink);padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.slider{position:relative;overflow:hidden}
.frame.slider .track{position:absolute;inset:0}
.frame.slider .track img{position:static}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:color-mix(in srgb,var(--bg) 90%,transparent);color:var(--ink);font:400 1.6rem/1 var(--f-body);cursor:pointer;box-shadow:0 4px 14px -6px rgba(0,0,0,.4);display:grid;place-items:center;padding:0 0 3px}
.nav-arrow:hover{background:var(--accent);color:var(--accent-ink)}
.nav-arrow.prev{left:12px}.nav-arrow.next{right:12px}
.page-name{position:absolute;left:12px;top:12px;font-size:.78rem;background:var(--bg);color:var(--ink);padding:4px 12px;border-radius:999px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.frame.slider .dot{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.frame.slider .dot.on{background:var(--accent)}
.slider .track{display:flex;height:100%;transition:transform .6s ease}
.slider .track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block}
.slider .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.slider .dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.6);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.slider .dot.on{background:#fff;width:20px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.slider .track{transition:none}}
.logo-strip{display:flex;align-items:center;justify-content:flex-start;gap:clamp(8px,1.6vw,16px);padding:14px 0 4px;background:transparent}
.logo-strip img{height:auto;max-height:clamp(28px,3.4vw,40px);width:auto;max-width:28%;min-width:0;flex:0 1 auto;object-fit:contain}
.logo-strip img.wide{width:clamp(70px,9vw,120px);max-width:28%}
.logo-arrow{color:var(--muted);font-size:1.2rem;flex:none}
a.title-link{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px}
a.title-link:hover{color:var(--accent)}
a.cap-link{text-decoration:none}
a.cap-link:hover{background:var(--accent);color:var(--accent-ink)}
.case-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:3px;background:var(--line)}
a.case-img{position:relative;display:block}
.img-link{position:absolute;right:12px;bottom:12px;font-size:.78rem;font-weight:700;background:var(--bg);color:var(--accent);padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
a.case-img:hover .img-link{background:var(--accent);color:var(--accent-ink)}
.case-img img{width:100%;height:100%;object-fit:cover;display:block}
.case-body{padding:24px 26px 26px;display:grid;gap:12px;min-width:0}
.case-body .label{margin:0}
.case h4{margin:0;font-family:var(--f-display);font-size:1.25rem;line-height:1.3;color:var(--ink)}
.groups{display:grid;gap:44px}
.group{display:grid;gap:18px}
.group-title{margin:0;font-size:1.1rem;color:var(--accent);padding-bottom:10px;border-bottom:2px solid var(--accent-soft)}
.case-role{margin:0;color:var(--muted);font-size:.92rem;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0}
.stats>div{flex:1 1 120px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;display:grid;gap:2px}
.stats b{font-size:1.45rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--on-hero-text)}
.case-more{margin-top:2px}
.case-more>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;padding:8px 0 0;border-top:1px solid var(--line);color:var(--accent);font-weight:700;font-size:.85rem}
.case-more>summary::-webkit-details-marker{display:none}
.plus{position:relative;flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);transition:background .2s,transform .25s}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;border-radius:2px;background:var(--accent)}
.plus::after{transform:rotate(90deg);transition:transform .25s}
.case-more>summary:hover .plus{background:var(--accent)}
.case-more>summary:hover .plus::before,.case-more>summary:hover .plus::after{background:var(--accent-ink)}
.case-more[open] .plus::after{transform:rotate(0deg)}
.case-more>summary:focus-visible{outline:2px solid var(--cta);outline-offset:3px;border-radius:8px}
.more-body{display:grid;gap:12px;padding-top:14px}
.more-body.open-body{padding-top:2px}
@media (prefers-reduced-motion:reduce){.plus,.plus::after{transition:none}}
.case-ch{margin:0;color:var(--ink);font-size:.95rem}
.case-ch.has-tick{display:flex;gap:10px;align-items:flex-start}
.tick{flex:none;width:20px;height:20px;margin-top:2px}
.tick circle{fill:var(--cta)}
.tick path{stroke:var(--cta-ink)}
.case .built{font-size:.93rem;color:var(--muted);margin:0}

/* Career path tree */
.comms-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:start}
.career{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:grid;gap:18px;min-width:0}
.tree{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:18px}
.tree::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--accent-soft)}
.co{position:relative;padding-left:24px;display:grid;gap:8px}
.co-dot{position:absolute;left:1px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.co.dev .co-dot{background:var(--cta)}
.co.dev .co-years{color:var(--cta)}
.co-head{display:grid;gap:1px}
.co-head b{font-size:.9rem;color:var(--ink);line-height:1.3}
.co-note{font-size:.78rem;color:var(--muted)}
.co-years{font-size:.8rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.roles{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.roles li{position:relative;padding:7px 10px;border:1px solid var(--line);border-radius:14px;display:grid;gap:2px;background:var(--bg)}
.roles li::before{content:"";position:absolute;left:-17px;top:50%;width:15px;height:2px;background:var(--accent-soft)}
section[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 60px)}
.roles li.r-link{padding:0}
.roles li.r-link a{display:grid;gap:2px;padding:7px 10px;border-radius:14px;text-decoration:none}
.roles li.r-link:hover{border-color:var(--cta)}
.roles li.r-link:hover .r-title{color:var(--cta)}
.r-title{font-size:.8rem;font-weight:600;color:var(--ink);line-height:1.35}
.r-dates{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-height:860px){.career{position:static}}
@media (max-width:1000px){.comms-layout{grid-template-columns:1fr}.career{position:static;order:-1}}

/* Report list */
#work>.wrap{padding-block:64px 72px}
.projects{display:grid;gap:22px}
.card{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:36px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:28px;background:var(--bg);cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:var(--cta);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-2px)}}
.card-body{min-width:0;padding-right:12px}
.frame{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.frame iframe,.frame>img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.frame>img{object-fit:cover;object-position:top left}
.wire{position:absolute;inset:0;display:grid;grid-template-rows:auto auto 1fr;gap:4%;padding:5%}
.wire .t{font-weight:700;color:var(--ink);font-size:clamp(.7rem,1.3vw,.95rem)}
.wire .k{display:grid;grid-template-columns:repeat(4,1fr);gap:3%}
.wire .k span,.wire .v span{background:var(--surface);border-radius:8px;min-height:2.2em}
.wire .v{display:grid;grid-template-columns:1.5fr 1fr;gap:3%}
.wire .v span{position:relative;overflow:hidden}
.wire .v span:first-child::after{content:"";position:absolute;left:6%;right:6%;bottom:12%;height:50%;background:linear-gradient(to top right,transparent 49%,var(--chart) 50%,transparent 52%)}
.note{position:absolute;right:3%;bottom:4%;font-size:clamp(8px,1vw,11px);font-weight:700;background:var(--accent-soft);color:var(--accent);padding:.3em .8em;border-radius:999px}
.chips span.chip-claude{color:var(--claude);background:var(--claude-soft)}
.card h3{font-weight:700;font-size:1.3rem;line-height:1.3;margin:0 0 10px}
.ai-badge{display:inline-flex;margin:0 0 12px;font-size:.8rem;font-weight:700;color:var(--claude);background:var(--claude-soft);padding:4px 12px;border-radius:999px}
.sheet-head .ai-badge{margin:8px 0 0}
.card p.sum{margin:0 0 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.78rem;font-weight:600;padding:4px 12px;border-radius:999px;color:var(--accent);background:var(--accent-soft)}
.card-foot{margin-top:20px}
.card .btn.primary{background:var(--cta);color:var(--cta-ink)}
.more{display:flex;justify-content:center;margin-top:36px}
@media (max-width:760px){.card{grid-template-columns:1fr;gap:18px;padding:12px;border-radius:24px}.card-body{padding:0 6px 8px}}

/* Report viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:1160px;background:var(--bg);color:var(--ink);border-radius:28px;padding:24px 28px 30px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.sheet-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:18px}
.sheet-head h3{font-weight:700;font-size:clamp(1.25rem,2.6vw,1.7rem);line-height:1.2;margin:0}
.close{flex:none;font:600 .85rem var(--f-body);background:var(--surface);border:0;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.notes{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:32px;margin-top:24px}
.notes>div{min-width:0}
.notes p{margin:0 0 14px;color:var(--muted)}
.notes dl{margin:0;display:grid;gap:14px}
.notes dt{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.notes dd{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.built{margin:4px 0 0;padding-left:1.1em;display:grid;gap:8px}
.built strong{color:var(--ink)}
.built li::marker{color:var(--cta)}
.impact{display:flex;gap:10px;align-items:baseline;padding:12px 16px;background:var(--accent-soft);border-radius:16px;margin-bottom:14px}
.impact b{font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.reflection{margin:24px 0 0;padding:18px 22px;border-radius:20px;background:var(--cta-soft);color:var(--ink);font-size:.98rem;font-style:italic}
.insights{margin-top:26px;padding:22px 24px;background:var(--surface);border-radius:20px}
.insights ul{margin:6px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px 32px}
.insights li{position:relative;padding-left:20px;font-size:.95rem}
.insights li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--cta)}
@media (max-width:760px){.insights ul{grid-template-columns:1fr}.insights{padding:18px}}
a.open{font-weight:700;text-decoration:none}
a.open:hover{text-decoration:underline}
@media (max-width:860px){.notes{grid-template-columns:1fr;gap:18px}.sheet{padding:16px;border-radius:22px}}

/* Skills band */
#skills{background:var(--hero);position:relative;overflow:hidden}
#skills h2,#skills .skill h3{color:var(--on-hero)}
.certs-h{margin:36px 0 0;font-size:1.1rem;color:var(--on-hero)}
.certs-h + .certs{margin-top:14px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 40px}
.skill h3{font-size:.95rem;font-weight:700;margin:0 0 6px}
.skill.wide{grid-column:1/-1}
.skill p{margin:0;color:var(--on-hero-text);font-size:.95rem}
@media (min-width:1000px){.skills{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.tools-line{margin:8px 0 0}
.skill-rows{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:820px}
.skill-rows li{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:6px 24px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--on-hero) 18%,transparent)}
.skill-rows li:first-child{padding-top:4px}
.skill-rows .area{font-weight:700;color:var(--on-hero)}
.skill-rows .tools{color:var(--on-hero-text)}
@media (max-width:600px){.skill-rows li{grid-template-columns:1fr}}
.skill-list{margin:8px 0 0;padding-left:1.1em;display:grid;gap:5px;color:var(--on-hero-text);font-size:.95rem}
.skill-list li::marker{color:var(--cta)}
.skill.wide .skill-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));column-gap:40px}
.certs{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
.cert{display:inline-flex;gap:10px;align-items:center;padding:7px 16px 7px 7px;border-radius:999px;background:var(--bg);font-size:.92rem;color:var(--ink);text-decoration:none}
.cert code{font-family:var(--f-body);font-size:.75rem;font-weight:700;background:var(--cta);color:var(--cta-ink);padding:4px 10px;border-radius:999px}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px 56px;align-items:start}
.bg-col{min-width:0;display:grid;gap:20px}
.edu{display:grid;gap:12px}
.edu-item{border:1px solid var(--line);border-radius:20px;padding:14px 20px}
.edu-item h3{margin:0;font-size:1rem;color:var(--ink)}
.edu-item p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.edu-item p.edu-years{font-size:.82rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.bg-col .sub-h{margin-top:14px}
.langs{display:flex;flex-wrap:wrap;gap:14px}
.lang{display:flex;align-items:center;gap:12px;padding:12px 20px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.lang-name{font-weight:700;color:var(--ink)}
.lang-level{font-size:.8rem;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
#contact>.wrap{padding-top:16px}
.cert-card{flex:1 1 100%;background:var(--bg);border-radius:24px;padding:22px 24px;display:grid;gap:14px}
.cert-top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px}
.cert-top code{font-family:var(--f-body);font-size:.85rem;font-weight:700;background:var(--cta);color:var(--cta-ink);padding:8px 14px;border-radius:999px}
.cert-id{flex:1 1 220px;min-width:0}
.cert-id h3{margin:0;font-size:1.05rem;color:var(--ink)}
.cert-meta{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.cert-verify{font-weight:700;font-size:.9rem;text-decoration:none}
.cert-verify:hover{text-decoration:underline}
.cert-note{margin:0;color:var(--ink);font-size:.95rem}
.cert-card .label{margin:4px 0 0}
.know{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.know>div{background:var(--surface);border-radius:16px;padding:14px 16px;min-width:0}
.know h4{margin:0 0 4px;font-size:.92rem;color:var(--accent)}
.know p{margin:0;font-size:.88rem;color:var(--muted)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;background:var(--cta-soft);border-radius:28px 28px 28px 90px;padding:40px}
.contact p{color:var(--muted);max-width:44ch;margin:12px 0 0}
.links{display:grid}
.link{display:grid;grid-template-columns:7em 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--cta) 35%,transparent)}
.link:last-child{border-bottom:0}
.link .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.link .val{font-weight:600;overflow-wrap:anywhere;min-width:0}
.link a.val{text-decoration:none}
.link a.val:hover{text-decoration:underline}
.copy{font:600 .75rem var(--f-body);background:var(--bg);border:0;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
@media (max-width:760px){.contact{grid-template-columns:1fr;gap:20px;padding:24px;border-radius:24px 24px 24px 56px}.link{grid-template-columns:5.5em 1fr auto}}
footer .wrap{padding-block:28px 32px;color:var(--muted);font-size:.85rem;text-align:center}
</style>

function linkify(html, links) {
  if (!links) return html;
  Object.entries(links).forEach(([text, url]) => { html = html.replace(e(text), `<a href="${e(url)}" target="_blank" rel="noopener">${e(text)}</a>`); });
  return html;
}
function caseCard(c) {
  return `<article class="case">
    ${c.slides && c.slides.length ? `<div class="case-img slider" aria-roledescription="carousel" aria-label="${e(c.title)} photos"><div class="track">${c.slides.map((src, i) => `<img src="${e(src)}" alt="${e(c.title)} photo ${i + 1} of ${c.slides.length}">`).join("")}</div><div class="dots">${c.slides.map((_, i) => `<button type="button" class="dot${i === 0 ? " on" : ""}" aria-label="Show photo ${i + 1}"></button>`).join("")}</div></div>` : ""}${c.images && c.images.length ? `<div class="case-gallery">${c.images.map(im => { const src = typeof im === "string" ? im : im.src, cap = typeof im === "string" ? "" : im.caption, link = typeof im === "string" ? "" : im.link; return `<figure class="case-img">${`<img src="${e(src)}" alt="${e(cap || c.title)}">`}${cap ? (link ? `<figcaption><a class="img-cap cap-link" href="${e(link)}" target="_blank" rel="noopener">${e(cap)} ↗</a></figcaption>` : `<figcaption class="img-cap">${e(cap)}</figcaption>`) : ""}</figure>`; }).join("")}</div>` : ""}${c.image ? (c.link ? `<a class="case-img" href="${e(c.link)}" target="_blank" rel="noopener" aria-label="Visit ${e(c.title)} website"><img src="${e(c.image)}" alt="${e(c.title)}"><span class="img-link">${c.linkLabel ? e(c.linkLabel) : short(c.link).split("/")[0]} ↗</span></a>` : `<div class="case-img"><img src="${e(c.image)}" alt="${e(c.title)}"></div>`) : ""}
    <div class="case-body">
      ${c.tag ? `<p class="label">${e(c.tag)}</p>` : ""}
      <h4>${c.titleLink ? `<a class="title-link" href="${e(c.titleLink)}" target="_blank" rel="noopener">${e(c.title)}</a>` : e(c.title)}</h4>
      <p class="case-role">${e(c.org)} · Role: ${e(c.role)}</p>
      ${c.expanded ? `<div class="more-body open-body">` : `<details class="case-more"><summary><span class="more-label">See details</span><span class="plus" aria-hidden="true"></span></summary><div class="more-body">`}
      ${c.logos && c.logos.length ? `<div class="logo-strip" aria-label="Brand journey">${c.logos.map((l, k) => `${k ? `<span class="logo-arrow" aria-hidden="true">→</span>` : ""}<img src="${e(l.src)}" alt="${e(l.name)} logo" class="${l.wide ? "wide" : ""}">`).join("")}</div>` : ""}
      ${c.stats && c.stats.length ? `<div class="stats">${c.stats.map(s => `<div><b>${e(s[0])}</b><span>${e(s[1])}</span></div>`).join("")}</div>` : ""}
      ${c.brief ? (c.tick ? `<p class="case-ch has-tick"><svg class="tick" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10"/><path d="M5.5 10.4l3 3 6-6.4" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${linkify(e(c.brief), c.briefLinks)}</span></p>` : `<p class="case-ch">${linkify(e(c.brief), c.briefLinks)}</p>`)+`${c.did && c.did.length ? `<ul class="built">${c.did.map(t => `<li>${linkify(e(t), c.briefLinks)}</li>`).join("")}</ul>` : ""}` : `<p class="case-ch has-tick"><svg class="tick" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10"/><path d="M5.5 10.4l3 3 6-6.4" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${e(c.challenge)}</span></p>
      ${c.ticks ? c.did.map(t => `<p class="case-ch has-tick"><svg class="tick" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10"/><path d="M5.5 10.4l3 3 6-6.4" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${linkify(e(t), c.briefLinks)}</span></p>`).join("") : `<ul class="built">${c.did.map(t => `<li>${linkify(e(t), c.briefLinks)}</li>`).join("")}</ul>`}`}
      </div>${c.expanded ? "" : "</details>"}
    </div></article>`;
}

const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = u => e(String(u).replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""));
const S = SITE, C = S.contact;
const n = S.projects.length;

// Cards show a screenshot of the report's first page. The viewer shows the live, interactive report.
function frame(p, live) {
  if (live && HOSTED && p.embedUrl) return `<iframe title="${e(p.title)}" src="${e(p.embedUrl)}" loading="lazy" allowfullscreen></iframe>`;
  if (p.image) return `<img src="${e(p.image)}" alt="First page of ${e(p.title)}">` + (live && p.embedUrl ? `<span class="note">Interactive report loads on the hosted site</span>` : "");
  return `<div class="wire" aria-label="Report placeholder"><span class="t">${e(p.title)}</span><div class="k"><span></span><span></span><span></span><span></span></div><div class="v"><span></span><span></span></div></div>` +
    `<span class="note">${p.embedUrl ? "Live report loads on the hosted site" : "Add a Publish to web link"}</span>`;
}

function card(p, i) {
  return `<article class="card" id="project-${i + 1}" data-i="${i}"${i >= FEATURED ? " hidden" : ""}>
    <div class="frame">${frame(p, false)}</div>
    <div class="card-body"><p class="label">${e(p.tag)}</p><h3>${e(p.title)}</h3>${p.badge ? `<p class="ai-badge">${e(p.badge)}</p>` : ""}<p class="sum">${e(p.summary)}</p>
      ${p.stack.length ? `<div class="chips">${p.stack.map(s => `<span${s === "Claude" ? ' class="chip-claude"' : ""}>${e(s)}</span>`).join("")}</div>` : ""}
      <div class="card-foot"><button class="btn primary" type="button">View dashboard</button></div>
    </div></article>`;
}

function sheet(p) {
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="sheet-head"><div><p class="label">${e(p.tag)}</p><h3 id="viewer-title">${e(p.title)}</h3>${p.badge ? `<p class="ai-badge">${e(p.badge)}</p>` : ""}</div><button class="close" type="button" id="viewer-close">Close</button></div>
    ${p.pages && p.pages.length > 1 && !(HOSTED && p.embedUrl) ? `<div class="frame slider pages" aria-roledescription="carousel" aria-label="${e(p.title)} pages"><div class="track">${p.pages.map((pg, k) => `<img src="${e(pg.src)}" alt="${e(p.title)}: ${e(pg.name || "Page " + (k + 1))}">`).join("")}</div><button type="button" class="nav-arrow prev" aria-label="Previous page">‹</button><button type="button" class="nav-arrow next" aria-label="Next page">›</button><div class="dots">${p.pages.map((pg, k) => `<button type="button" class="dot${k === 0 ? " on" : ""}" aria-label="Show ${e(pg.name || "page " + (k + 1))}"></button>`).join("")}</div><span class="page-name">${e(p.pages[0].name || "Page 1")}</span></div>` : `<div class="frame">${frame(p, true)}</div>`}
    <div class="notes">
      <div><p>${e(p.summary)}</p>
        ${p.liveUrl || p.embedUrl ? `<a class="open" href="${e(p.liveUrl || p.embedUrl)}" target="_blank" rel="noopener">Open full screen ↗</a>` : ""}</div>
      <div>${p.problem || p.approach ? `<dl>${p.problem ? `<div><dt>Question</dt><dd>${e(p.problem)}</dd></div>` : ""}${p.approach ? `<div><dt>What I built</dt><dd>${Array.isArray(p.approach) ? `<ul class="built">${p.approach.map(t => typeof t === "string" ? `<li>${e(t)}</li>` : `<li><strong>${e(t.title)}</strong>: ${e(t.text)}</li>`).join("")}</ul>` : e(p.approach)}</dd></div>` : ""}</dl>` : ""}</div>
      <div>${p.impact ? `<div class="impact"><b>${e(p.impact[0])}</b><span>${e(p.impact[1])}</span></div>` : ""}
        ${p.stack.length ? `<div class="chips">${p.stack.map(s => `<span${s === "Claude" ? ' class="chip-claude"' : ""}>${e(s)}</span>`).join("")}</div>` : ""}</div>
    </div>
    ${p.reflection ? `<blockquote class="reflection">${e(p.reflection)}</blockquote>` : ""}
    ${p.insights && p.insights.length ? `<div class="insights"><p class="label">Key insights</p><ul>${p.insights.map(t => `<li>${e(t)}</li>`).join("")}</ul></div>` : ""}
    </div>`;
}

const links = [
  C.email && `<div class="link"><span class="lbl">Email</span><span class="val" id="email">${e(C.email)}</span><button class="copy" type="button" id="copy-email">Copy</button></div>`,
  C.linkedin && `<div class="link"><span class="lbl">LinkedIn</span><a class="val" href="${e(C.linkedin)}" target="_blank" rel="noopener">${short(C.linkedin)}</a><span aria-hidden="true">↗</span></div>`,
  ...C.links.map(l => `<div class="link"><span class="lbl">${e(l.label)}</span><a class="val" href="${e(l.url)}" target="_blank" rel="noopener">${short(l.url)}</a><span aria-hidden="true">↗</span></div>`)
].filter(Boolean).join("");

document.getElementById("app").innerHTML = `
<nav class="nav" aria-label="Main"><div class="wrap"><a class="brand" href="#top">${e(S.name)}</a><ul>
  <li><a class="main" href="#comms">Comms</a></li>
  <li><a href="#work">Data</a></li>
  <li class="hide-sm"><a href="#skills">Skills</a></li><li><a href="#contact">Contact</a></li></ul></div></nav>

<div class="hero-outer"><header class="hero${S.photo ? "" : " solo"}" id="top"><div class="wrap">
  <div class="hero-text">
    <p class="label">${e(S.role)}${S.location ? ` · ${e(S.location)}` : ""}</p>
    <h1>${e(S.name)}</h1>
    <p class="intro">${e(S.intro)}</p>
    <div class="cta"><a class="btn white" href="#comms">See my work</a>${C.linkedin ? `<a class="btn outline" href="${e(C.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ""}</div>
  </div>
  ${S.photo ? `<div class="portrait"><img src="${e(S.photo)}" alt="Profile picture of ${e(S.name)}"></div>` : ""}
</div></header></div>

<section class="block" id="comms"><div class="wrap">
  <div class="sec-head"><h2>Communications Expertise</h2></div>
  <div class="comms-layout">
  <div class="groups">${S.commsGroups.map(g => `<div class="group"><h3 class="group-title">${e(g.title)}</h3><div class="cases">${g.cases.map(caseCard).join("")}</div></div>`).join("")}</div>
  ${S.career && S.career.length ? `<aside class="career" aria-label="Career path"><h3 class="group-title">Career Path</h3><ol class="tree">${S.career.map(co => `<li class="co${co.kind === "dev" ? " dev" : ""}"><span class="co-dot" aria-hidden="true"></span><div class="co-head"><b>${e(co.company)}</b>${co.note ? `<span class="co-note">${e(co.note)}</span>` : ""}<span class="co-years">${e(co.years)}</span></div><ul class="roles">${co.roles.map(r => { const inner = `<span class="r-title">${e(r.title)}${r.href ? (r.href.startsWith("http") ? " ↗" : " →") : ""}</span>${r.dates ? `<span class="r-dates">${e(r.dates)}</span>` : ""}`; return r.href ? `<li class="r-link"><a href="${e(r.href)}"${r.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${inner}</a></li>` : `<li>${inner}</li>`; }).join("")}</ul></li>`).join("")}</ol></aside>` : ""}
  </div>
</div></section>

<section class="block" id="work"><div class="wrap">
  <div class="sec-head"><h2>Data Analysis & Visualization</h2></div>
  <div class="projects">${S.projects.map(card).join("")}</div>
  ${n > FEATURED ? `<div class="more"><button class="btn soft" type="button" id="see-all" aria-expanded="false">View all dashboards</button></div>` : ""}
</div></section>

<section class="block minor" id="skills"><div class="wrap"><div class="sec-head"><h2>Skills &amp; Tools</h2></div>
  <ul class="skill-rows">${S.skillRows.map(r => `<li><span class="area">${e(r.area)}</span><span class="tools">${e(r.tools)}</span></li>`).join("")}</ul>
  ${S.certs.length ? `<h3 class="certs-h">Certification</h3><div class="certs">${S.certs.map(c => `<div class="cert-card">
    <div class="cert-top"><code>${e(c.code)}</code><div class="cert-id"><h3>${e(c.name)}</h3>${c.issued ? `<p class="cert-meta">Issued: ${e(c.issued)}</p>` : ""}</div>${c.url ? `<a class="cert-verify" href="${e(c.url)}" target="_blank" rel="noopener">Verify on Credly ↗</a>` : ""}</div>
    ${c.note ? `<p class="cert-note">${e(c.note)}</p>` : ""}
    ${c.knowledge && c.knowledge.length ? `<p class="label">Key knowledge</p><div class="know">${c.knowledge.map(k => `<div><h4>${e(k.area)}</h4><p>${e(k.items)}</p></div>`).join("")}</div>` : ""}
  </div>`).join("")}</div>` : ""}
</div></section>

<section class="block minor" id="background"><div class="wrap"><div class="bg-grid">
  ${S.education && S.education.length ? `<div class="bg-col"><h2>Education</h2><div class="edu">${S.education.map(d => `<div class="edu-item"><h3>${e(d.degree)}</h3><p>${e(d.school)}</p>${d.years ? `<p class="edu-years">${e(d.years)}</p>` : ""}</div>`).join("")}</div></div>` : ""}
  ${S.languages && S.languages.length ? `<div class="bg-col">${S.prizes && S.prizes.length ? `<h2>Prize</h2><div class="edu">${S.prizes.map(z => `<div class="edu-item"><h3>${e(z.title)}</h3><p>${e(z.detail)}</p>${z.year ? `<p class="edu-years">${e(z.year)}</p>` : ""}</div>`).join("")}</div>` : ""}<h2${S.prizes && S.prizes.length ? ` class="sub-h"` : ""}>Languages</h2><div class="langs">${S.languages.map(l => `<div class="lang"><span class="lang-name">${e(l.name)}</span><span class="lang-level">${e(l.level)}</span></div>`).join("")}</div></div>` : ""}
</div></div></section>

<section class="block minor" id="contact"><div class="wrap"><div class="contact"><div><h2>Contact</h2><p>${e(C.intro)}</p></div><div class="links">${links}</div></div></div></section>
<footer><div class="wrap">${e(S.name)} · Portfolio</div></footer>
<div class="viewer" id="viewer" hidden></div>`;

// Report viewer
const viewer = document.getElementById("viewer");
let lastFocus = null;
function openReport(i) {
  lastFocus = document.activeElement;
  viewer.innerHTML = sheet(S.projects[i]);
  viewer.hidden = false;
  viewer.querySelectorAll(".slider").forEach(sl => initSlider(sl, false));
  document.body.classList.add("locked");
  document.getElementById("viewer-close").focus();
}
function closeReport() {
  viewer.hidden = true;
  viewer.innerHTML = "";
  document.body.classList.remove("locked");
  if (lastFocus) lastFocus.focus();
}
document.querySelector(".projects").addEventListener("click", ev => {
  const c = ev.target.closest(".card");
  if (c) openReport(+c.dataset.i);
});
viewer.addEventListener("click", ev => {
  if (ev.target === viewer || ev.target.id === "viewer-close") closeReport();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !viewer.hidden) closeReport(); });

const seeAll = document.getElementById("see-all");
if (seeAll) seeAll.addEventListener("click", () => {
  const open = seeAll.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll(".projects .card").forEach((a, i) => { if (i >= FEATURED) a.hidden = !open; });
  seeAll.setAttribute("aria-expanded", String(open));
  seeAll.textContent = open ? "Show fewer" : "View all dashboards";
  if (open) document.getElementById(`project-${FEATURED + 1}`).scrollIntoView({ block: "start" });
  else document.getElementById("work").scrollIntoView({ block: "start" });
});

function initSlider(sl, auto) {
  const track = sl.querySelector(".track"), dots = [...sl.querySelectorAll(".dot")], n = dots.length;
  let i = 0, timer = null;
  const go = k => { i = (k + n) % n; track.style.transform = `translateX(-${i * 100}%)`; dots.forEach((d, j) => d.classList.toggle("on", j === i)); };
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const start = () => { if (!reduce && n > 1) { clearInterval(timer); timer = setInterval(() => go(i + 1), 5000); } };
  const stop = () => clearInterval(timer);
  dots.forEach((d, j) => d.addEventListener("click", () => { go(j); start(); }));
  sl.addEventListener("mouseenter", stop); sl.addEventListener("mouseleave", start);
  const prev = sl.querySelector(".prev"), next = sl.querySelector(".next"), label = sl.querySelector(".page-name"), names = sl.dataset.names ? JSON.parse(sl.dataset.names) : null;
  if (prev) prev.addEventListener("click", () => { go(i - 1); start(); });
  if (next) next.addEventListener("click", () => { go(i + 1); start(); });
  if (label) { const imgs = [...track.querySelectorAll("img")]; const upd = () => { label.textContent = imgs[i].alt.split(": ").slice(1).join(": "); }; dots.forEach(d => d.addEventListener("click", upd)); [prev, next].forEach(b => b && b.addEventListener("click", upd)); }
  if (auto) start();
}
document.querySelectorAll(".case .slider").forEach(sl => initSlider(sl, true));
document.querySelectorAll(".case-more").forEach(d => d.addEventListener("toggle", () => { const l = d.querySelector(".more-label"); if (l) l.textContent = d.open ? "Hide details" : "See details"; }));
const btn = document.getElementById("copy-email");
if (btn) btn.addEventListener("click", () => {
  const el = document.getElementById("email");
  const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; };
  try { navigator.clipboard.writeText(el.textContent).then(() => btn.textContent = "Copied", sel); } catch (_) { sel(); }
  setTimeout(() => btn.textContent = "Copy", 1600);
});
</script>
</body></html>
